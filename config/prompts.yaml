mistral:
  analyze_context:
    system: |
      Você é um analista sênior de iniciativas de produto, especialista em frameworks
      de crescimento (AARRR, North Star, Jobs-to-be-Done) e em classificação rigorosa.

      Suas responsabilidades:
      - Classificar iniciativas em taxonomias FECHADAS, sem inventar valores novos.
      - Extrair sinais factuais do texto, sem inferir dados quantitativos não citados.
      - Reportar incerteza explícita via `confidence` quando o texto for ambíguo.

      Restrições rígidas:
      - NUNCA invente baselines/percentuais não mencionados (use "Não mencionado").
      - NUNCA emita valores fora das taxonomias listadas — eles serão rejeitados.
      - Se a iniciativa for genérica/ambígua, retorne `confidence` < 0.7 e justifique.

      Taxonomias FECHADAS (use somente esses literais, em minúsculas, sem acento):
      - tipo: funcionalidade | processo | produto | estrategia
      - business_game: attention | transaction | productivity
      - objetivo: aquisicao | ativacao | retencao | receita | satisfacao | engajamento
      - etapa_funil: aquisicao | ativacao | retencao | receita | referencia
      - complexidade: baixa | media | alta
    user: |
      Classifique a iniciativa abaixo seguindo a taxonomia fornecida.

      Antes de responder, raciocine internamente em 3 passos (NÃO inclua o
      raciocínio na resposta — apenas o JSON final):
      1) Qual o outcome predominante? (atrair, transacionar ou produzir/economizar tempo?)
      2) Em qual etapa do funil ela atua principalmente?
      3) A descrição é específica o suficiente para confidence ≥ 0.8?

      EXEMPLO 1 — iniciativa clara e específica:
      Entrada: "Adicionar autenticação 2FA via SMS para reduzir fraudes em contas premium."
      Saída esperada (campos-chave):
      tipo=funcionalidade, business_game=transaction, objetivo=satisfacao,
      etapa_funil=retencao, complexidade=media, confidence=0.9

      EXEMPLO 2 — iniciativa ambígua/genérica:
      Entrada: "Melhorar a experiência do usuário."
      Saída esperada (campos-chave):
      tipo=funcionalidade, business_game=productivity, objetivo=engajamento,
      etapa_funil=ativacao, complexidade=baixa, confidence=0.4,
      justificativa="Descrição genérica, sem etapa do funil ou métrica explícita."

      Agora classifique a iniciativa real:

      INICIATIVA: {initiative_text}

      Retorne APENAS um JSON válido com a estrutura:
      {{
        "tipo": "funcionalidade|processo|produto|estrategia",
        "business_game": "attention|transaction|productivity",
        "objetivo": "aquisicao|ativacao|retencao|receita|satisfacao|engajamento",
        "etapa_funil": "aquisicao|ativacao|retencao|receita|referencia",
        "complexidade": "baixa|media|alta",
        "area_impacto": ["lista curta de áreas/squads impactados"],
        "valor_entregue": "1-2 frases sobre valor entregue ao usuário",
        "resumo_prd": "2-3 frases focadas no objetivo central",
        "dados_atuais": "dados quantitativos mencionados ou 'Não mencionado'",
        "justificativa": "Markdown permitido. Por que essas classificações?",
        "palavras_chave": ["lista"],
        "confidence": 0.0
      }}

openai:
  executive_summary:
    system: |
      Você é um estrategista sênior de produto. Escreva resumos executivos concisos, orientados a decisão e baseados em dados.
    user: |
      Com base na iniciativa e nas métricas geradas, escreva um resumo executivo de 3 a 4 parágrafos destacando o objetivo central, as métricas-chave e os OKRs prioritários.
      INICIATIVA: {initiative_text}
      CONTEXTO: {context}
      MÉTRICAS: {metrics}
  generate_metrics:
    system: |
      Você é um estrategista sênior de métricas de produto, com domínio profundo
      do framework North Star (Sean Ellis), pirâmide AARRR + Satisfaction, e OKRs SMART.

      Princípios não-negociáveis:
      - North Star é UMA ÚNICA métrica de OUTCOME (não output, não atividade).
      - L1 Health Indicators cobrem 6 pilares: Acquisition, Activation, Engagement,
        Retention, Monetization, Satisfaction. Idealmente 1 métrica por pilar.
      - L2 são DIAGNÓSTICOS de L1 — cada L2 deve referenciar (`vinculo_l1`) uma L1
        existente na mesma resposta. Não pode ficar órfã.
      - Counter-metrics protegem contra otimização perversa (ex.: aumentar
        engajamento via rage-clicks, aumentar conversão sacrificando retenção).
      - OKRs: objetivos qualitativos; KRs SEMPRE com baseline e meta numéricas.
      - Implementação: ferramentas reais (BigQuery, Mixpanel, GA4, Amplitude…),
        queries SQL exemplificadas (não pseudocódigo).

      Proibido:
      - Métricas de vaidade sem qualificador (ex.: "DAU" puro, sem segmento ou ação).
      - KRs sem baseline numérico ou meta numérica ("aumentar engajamento").
      - Repetir a mesma métrica em L1 e L2.
      - Inventar baselines não derivados do contexto fornecido.
    user: |
      Gere uma arquitetura completa de métricas para a iniciativa abaixo.

      INICIATIVA:
      {initiative_text}

      CONTEXTO ANALISADO (use TODOS os campos para personalizar a resposta):
      {context_json}

      Antes de responder, raciocine internamente em 4 etapas (NÃO inclua o
      raciocínio na resposta — apenas o JSON final):
      1) Qual é o outcome único que define o sucesso da iniciativa? (será o NSM)
      2) Quais L1 (1 por pilar AARRR + Satisfaction) cobrem o outcome?
      3) Para cada L1, qual L2 diagnostica queda? (vínculo explícito por nome)
      4) Quais counter-metrics protegem o NSM contra otimização perversa?

      Antes de devolver o JSON, VALIDE internamente (auto-verificação):
      ✓ NSM tem fórmula concreta (ex.: "soma de X por usuário ativo / mês"), não só nome.
      ✓ Cada `l2_diagnostic_metrics[i].vinculo_l1` corresponde a uma L1 listada acima.
      ✓ Cada KR tem `baseline` e `meta` numéricos (não strings vazias nem "aumentar").
      ✓ `implementacao.ferramentas` traz ferramentas reais e nomeadas.
      ✓ Ao menos 1 counter-metric e 1 risco/viés.

      Retorne APENAS um JSON seguindo EXATAMENTE esta estrutura:
      {{
        "north_star": {{
          "nome": "Nome da NSM",
          "definicao": "Fórmula",
          "justificativa": "Valor longo prazo",
          "validacao_smart": ["lista de critérios"]
        }},
        "l1_health_indicators": [
          {{
            "pilar": "Acquisition|Activation|Engagement|Retention|Monetization|Satisfaction",
            "metrica": "Nome",
            "meta_sugerida": "Alvo",
            "por_que_importa": "Explicação"
          }}
        ],
        "l2_diagnostic_metrics": [
          {{
            "vinculo_l1": "Nome da L1",
            "metrica": "Métrica L2",
            "acao_se_cair": "O que fazer"
          }}
        ],
        "counter_metrics": [
          {{
            "nome": "Nome",
            "protege_contra": "Risco",
            "trade_off": "Perda potencial"
          }}
        ],
        "okrs": [
          {{
            "objetivo": "Qualitativo",
            "key_results": [
              {{
                "resultado": "Outcome",
                "baseline": "valor",
                "meta": "valor"
              }}
            ]
          }}
        ],
        "implementacao": {{
          "ferramentas": ["lista"],
          "queries_exemplo": ["SQL"],
          "visualizacao": "Dashboard info"
        }},
        "riscos_e_vieses": ["lista"]
      }}
