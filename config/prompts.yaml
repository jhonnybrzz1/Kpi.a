mistral:
  analyze_context:
    system: |
      Você é um especialista em análise de projetos e frameworks de crescimento.
    user: |
      Analise a iniciativa abaixo e forneça uma análise estruturada.
      INICIATIVA: {initiative_text}

      Retorne APENAS um JSON com:
      {{
        "tipo": "funcionalidade|processo|produto|estrategia",
        "business_game": "attention|transaction|productivity",
        "objetivo": "aquisicao|ativacao|retencao|receita|satisfacao|engajamento",
        "etapa_funil": "aquisicao|ativacao|retencao|receita|referencia",
        "complexidade": "baixa|media|alta",
        "area_impacto": ["lista"],
        "valor_entregue": "texto",
        "resumo_prd": "2-3 frases sobre o objetivo central",
        "dados_atuais": "texto",
        "justificativa": "Markdown permitido",
        "palavras_chave": ["lista"]
      }}

openai:
  generate_metrics:
    system: |
      Você é um estrategista sênior de métricas de produto (North Star Framework).
    user: |
      Gere uma arquitetura de métricas completa para a iniciativa.
      INICIATIVA: {initiative_text}
      CONTEXTO: {context_tipo}, {context_objetivo}, {context_etapa_funil}

      Retorne APENAS um JSON seguindo EXATAMENTE esta estrutura:
      {{
        "north_star": {{
          "nome": "Nome da NSM",
          "definicao": "Fórmula",
          "justificativa": "Valor longo prazo",
          "validacao_smart": ["lista de critérios"]
        }},
        "l1_health_indicators": [
          {{
            "pilar": "Acquisition|Activation|Engagement|Retention|Monetization|Satisfaction",
            "metrica": "Nome",
            "meta_sugerida": "Alvo",
            "por_que_importa": "Explicação"
          }}
        ],
        "l2_diagnostic_metrics": [
          {{
            "vinculo_l1": "Nome da L1",
            "metrica": "Métrica L2",
            "acao_se_cair": "O que fazer"
          }}
        ],
        "counter_metrics": [
          {{
            "nome": "Nome",
            "protege_contra": "Risco",
            "trade_off": "Perda potencial"
          }}
        ],
        "okrs": [
          {{
            "objetivo": "Qualitativo",
            "key_results": [
              {{
                "resultado": "Outcome",
                "baseline": "valor",
                "meta": "valor"
              }}
            ]
          }}
        ],
        "implementacao": {{
          "ferramentas": ["lista"],
          "queries_exemplo": ["SQL"],
          "visualizacao": "Dashboard info"
        }},
        "riscos_e_vieses": ["lista"]
      }}
