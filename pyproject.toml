[project]
name = "metricflow-ai"
version = "1.0.0"
description = "Sistema Inteligente de Sugestão de Métricas, KPIs e OKRs"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.98.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "requests>=2.32.4",
    "streamlit>=1.47.1",
    "weasyprint>=66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
